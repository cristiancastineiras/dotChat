# =============================================================================
#  dotChat — conjunto completo
# =============================================================================
#  Levanta la plataforma entera con un solo comando:
#
#      docker compose up -d --build
#
#  o, mejor, con el guion que además genera los secretos y espera a que todo
#  esté sano:
#
#      ./scripts/arrancar.ps1        (Windows)
#      ./scripts/arrancar.sh         (Linux y macOS)
#
#  Para probar el escalado horizontal, basta con pedir más réplicas:
#
#      docker compose up -d --scale servidor=3
#
#  Nada del servidor guarda estado en memoria: la presencia, la caché, el canal
#  de SignalR y las claves viven en Valkey, y los archivos en MinIO. Por eso se
#  pueden añadir y quitar instancias sin que el usuario note nada.
# =============================================================================

name: dotchat

x-servidor-comun: &servidor-comun
  build:
    context: .
    dockerfile: Dockerfile
  image: dotchat/servidor:local
  restart: unless-stopped
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: "8080"

    # Detrás de nginx no hay TLS que redirigir ni certificado que presentar.
    DOTCHAT_Servidor__RedirigirHttps: "false"
    DOTCHAT_AllowedHosts: "*"

    DOTCHAT_ConnectionStrings__BaseDatos: "Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=AppPassword123!;Maximum Pool Size=40"
    DOTCHAT_Valkey__Conexion: "valkey:6379"
    DOTCHAT_AlmacenObjetos__PuntoEntrada: "http://minio:9000"

    # Las trazas y las métricas van a Jaeger; los registros, a Seq.
    DOTCHAT_Telemetria__Trazas__PuntoEntrada: "http://jaeger:4317"
    DOTCHAT_Telemetria__Metricas__PuntoEntrada: "http://jaeger:4317"
    DOTCHAT_Telemetria__Registros__PuntoEntrada: "http://seq:5341/ingest/otlp/v1/logs"
    DOTCHAT_Telemetria__Entorno: "docker"

    # Los secretos los inyecta el fichero .env, que genera el guion de arranque
    # y que no se versiona.
    DOTCHAT_Jwt__ClaveFirmaBase64: "${DOTCHAT_CLAVE_JWT}"
    DOTCHAT_Cifrado__ClaveBase64: "${DOTCHAT_CLAVE_CIFRADO}"
    DOTCHAT_Administrador__Clave: "${DOTCHAT_CLAVE_ADMIN}"
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    minio:
      condition: service_healthy
    minio-inicial:
      condition: service_completed_successfully
  networks: [dotchat]

services:
  # ---------------------------------------------------------------------------
  #  Servidor de dotChat
  # ---------------------------------------------------------------------------
  #  Sin puertos publicados a propósito: se entra siempre por el balanceador, que
  #  es lo que permite escalar el servicio sin que dos réplicas peleen por el
  #  mismo puerto de la máquina anfitriona.
  # ---------------------------------------------------------------------------
  servidor:
    <<: *servidor-comun
    deploy:
      replicas: 2

  # ---------------------------------------------------------------------------
  #  Balanceador
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: dotchat-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./despliegue/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      servidor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/salud/vivo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [dotchat]

  # ---------------------------------------------------------------------------
  #  Cliente web
  # ---------------------------------------------------------------------------
  #  Build estático de la SPA (React + Vite) servido por su propio nginx, que
  #  además reenvía /api y /hubs al balanceador de arriba: así el navegador
  #  solo ve un origen y no hace falta CORS (ver src/Chat.Cliente.Web/nginx.conf).
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: src/Chat.Cliente.Web/Dockerfile
    image: dotchat/web:local
    container_name: dotchat-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [dotchat]

  # ---------------------------------------------------------------------------
  #  PostgreSQL — la fuente de verdad
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: AppPassword123!
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [dotchat]

  # ---------------------------------------------------------------------------
  #  Valkey — caché, presencia, canal de SignalR y anillo de claves
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:latest
    container_name: valkey-dev
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [dotchat]

  # ---------------------------------------------------------------------------
  #  MinIO — almacén de los archivos adjuntos
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [dotchat]

  # ---------------------------------------------------------------------------
  #  Creación del contenedor de adjuntos
  # ---------------------------------------------------------------------------
  #  El servidor sabe crearlo si falta, pero hacerlo aquí evita que dos réplicas
  #  arrancando a la vez intenten crearlo las dos, y deja el sitio donde poner
  #  las políticas de retención el día que hagan falta.
  # ---------------------------------------------------------------------------
  minio-inicial:
    image: quay.io/minio/mc
    container_name: dotchat-minio-inicial
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/dotchat-adjuntos &&
      mc anonymous set none local/dotchat-adjuntos &&
      echo 'Contenedor de adjuntos listo.'
      "
    networks: [dotchat]

  # ---------------------------------------------------------------------------
  #  Jaeger — trazas
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks: [dotchat]

  # ---------------------------------------------------------------------------
  #  Seq — registros estructurados
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Sin autenticación: es un entorno local. En cualquier otro sitio, aquí va
      # SEQ_FIRSTRUN_ADMINPASSWORDHASH y el servidor manda su clave de API.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
      - "5342:5341"
    volumes:
      - seq-data:/data
    networks: [dotchat]

  # ---------------------------------------------------------------------------
  #  Portainer — vista de los contenedores
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks: [dotchat]

networks:
  dotchat:
    driver: bridge

volumes:
  postgres-data:
  valkey-data:
  minio-data:
  seq-data:
  portainer-data:
