# =============================================================================
#  nginx del cliente web de dotChat
# =============================================================================
#  Sirve los archivos estáticos del build de Vite y reenvía /api y /hubs al
#  balanceador (ver docker-compose.yml, servicio "nginx"), que es quien reparte
#  entre las réplicas del servidor. Así el navegador solo habla con un origen
#  — el mismo truco que hace el proxy de Vite en desarrollo, ver
#  apps/webapp/vite.config.ts — y no hace falta CORS en ningún sitio.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Igual que en el balanceador: sin esto, el "Upgrade" de la conexión
    # WebSocket del hub de SignalR se quedaría en "keep-alive" y la conexión
    # jamás completaría el protocolo de actualización.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Algo de margen sobre el límite de adjuntos del servidor, igual que
        # en el balanceador (ver despliegue/nginx.conf).
        client_max_body_size 30m;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://nginx:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hubs/ {
            proxy_pass http://nginx:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket del hub de SignalR.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 90s;
        }

        # SPA con enrutado en el cliente (react-router): cualquier ruta que no
        # sea un archivo real cae en index.html, para que recargar la página
        # en, por ejemplo, /perfil no dé un 404 de nginx.
        location / {
            try_files $uri /index.html;
        }
    }
}
