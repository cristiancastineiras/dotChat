# =============================================================================
#  Balanceador de dotChat
# =============================================================================
#  Reparte el tráfico entre las réplicas del servicio "servidor" (ver
#  docker-compose.yml, deploy.replicas) y hace de único punto de entrada:
#  8080 es el único puerto publicado a la máquina anfitriona.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Necesario para dejar pasar el "Upgrade" de las conexiones WebSocket del hub
    # de SignalR: sin esto, Connection quedaría en "keep-alive" y el navegador/
    # cliente jamás completaría el protocolo de actualización.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker resuelve "servidor" a una dirección por cada réplica sana en el
    # instante en que nginx arranca (por eso, en docker-compose.yml, nginx
    # depende de "servidor" con condition: service_healthy). Con las dos réplicas
    # ya levantadas, ambas entran aquí como pares y nginx reparte por round robin
    # sin más configuración.
    upstream dotchat_servidor {
        server servidor:8080;
    }

    server {
        listen 8080;

        # Algo de margen sobre el límite de adjuntos del servidor (ver
        # Adjuntos:TamanoMaximoBytes en appsettings.json), para no cortar en el
        # borde una subida que el servidor sí aceptaría.
        client_max_body_size 30m;

        # Sonda de vida del propio backend: es lo que consulta el HEALTHCHECK de
        # este contenedor nginx.
        location /salud/vivo {
            proxy_pass http://dotchat_servidor;
            access_log off;
        }

        location / {
            proxy_pass http://dotchat_servidor;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket del hub de SignalR (y su reserva de HTTP largo para el
            # transporte de reserva por sondeo largo).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 90s;

            # "servidor" se resuelve a las direcciones de sus réplicas una sola vez,
            # al arrancar este contenedor (ver el comentario del "upstream" más
            # arriba): si una réplica se recrea después —se reinicia, Docker le
            # asigna otra IP—, esta réplica queda con una dirección muerta hasta que
            # el propio nginx se reinicie. Sin lo de abajo, la petición que le toque
            # en el reparto round robin devuelve directamente un 503 al cliente; con
            # ello, nginx detecta el fallo de conexión al instante (antes de que la
            # réplica muerta llegue a leer nada del cuerpo) y repite la misma
            # petición contra la otra réplica sin que quien la hizo note nada. Hace
            # falta "non_idempotent" porque una subida de archivo va por POST.
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
        }
    }
}
